name: CI

on:
  pull_request:
    branches:
      - master
      - r2.**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for master branches.
  cancel-in-progress: ${{ github.ref != 'master' }}

jobs:
  build-linux-x86-cpu:
    uses: ./.github/workflows/build-reusable.yml
    with:
      runner: 'linux-x86-n2-16'
      tfci: 'py313,linux_x86,rbe,no_docker'

  build-linux-x86-cuda:
    uses: ./.github/workflows/build-reusable.yml
    with:
      runner: 'linux-x86-n2-16'
      tfci: 'py313,linux_x86_cuda,rbe,no_docker'

  build-linux-x86-cuda13:
    uses: ./.github/workflows/build-reusable.yml
    with:
      runner: 'linux-x86-n2-16'
      tfci: 'py313,linux_x86_cuda13_nvcc,rbe,no_docker'

  build-arm64:
    uses: ./.github/workflows/build-reusable.yml
    with:
      runner: 'linux-x86-n2-16'
      tfci: 'py313,linux_arm64_cross_compile,rbe,no_docker,enable_pycpp_build'
      job_name: 'build-only'

  build-windows-x86:
    name: build-windows-cpu-noavx
    runs-on: windows-x86-n2-16
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        env:
          GIT_CONFIG_PARAMETERS: "'checkout.workers=12' 'core.featureManyFiles=true'"
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Build TensorFlow Windows CPU No-AVX Wheel
        run: ./tensorflow/tools/ci_build/windows/build_tf_windows_noavx.sh

      - name: Test Windows CPU No-AVX Wheel in Python
        run: ./tensorflow/tools/ci_build/windows/test_tf_windows_noavx.sh
